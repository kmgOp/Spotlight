<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Page | Spotlight</title><link rel="stylesheet" href="auth.css"><style>
[hidden]{display:none!important}body{background:radial-gradient(ellipse at 15% 5%,rgba(153,76,255,.15),transparent 38%),#0b0811;color:#f7f0ff}
.topnav{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.topnav a{color:#d8cce7;font-size:13px}
.wrap{width:min(1100px,92%);margin:34px auto}.hero{padding:28px;border:1px solid #49305e;border-radius:20px;background:linear-gradient(120deg,#21132f,#130d1d);margin-bottom:25px}

.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:1px solid #6d3996;background:#8c42ed;color:white;border-radius:9px;padding:11px 15px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}.btn.secondary{background:transparent;border-color:#49305e;color:#d8cce7}.status{font-size:13px;margin-top:12px;color:#c7a0ff}.pill{display:inline-block;border:1px solid #49305e;border-radius:20px;padding:5px 9px;color:#c7a0ff;font-size:11px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.auth-header{gap:12px;flex-wrap:wrap}.topnav{gap:12px}}
</style></head><body><header class="auth-header" style="display:flex;justify-content:space-between;align-items:center;gap:20px"><a href="feed.html" class="logo">spotlight<span>.</span></a><nav class="topnav"><a href="feed.html">Explore</a><a href="events.html">Events</a><a href="my-page.html">My Page</a><a id="dashLink" href="artist-dashboard.html">Dashboard</a><button id="logoutButton" class="secondary-button" style="width:auto;margin:0">Log Out</button></nav></header>
<main class="wrap"><section class="hero"><span class="eyebrow">YOUR PUBLIC PROFILE</span><h1>My <span style="color:#c7a0ff">Spotlight Page</span></h1><p>This is the profile other Spotlight users can see. Use your dashboard to edit your details.</p></section>
<section class="panel"><div id="profileView" class="muted">Loading your profile…</div><a id="editProfile" class="btn" href="artist-dashboard.html">Edit Profile</a> <a href="feed.html" class="btn secondary">View Explore</a></section>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,doc,getDoc,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDLe5UAVUYYfFZxIdaEIqz875uqAT2xEHA",authDomain:"spotlight-430c6.firebaseapp.com",projectId:"spotlight-430c6",storageBucket:"spotlight-430c6.firebasestorage.app",messagingSenderId:"37283174582",appId:"1:37283174582:web:eb0edb53f88786b8ecae17",measurementId:"G-MRHV343K1W"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
onAuthStateChanged(auth,async u=>{if(!u){location.replace("login.html");return;}try{const snap=await getDoc(doc(db,"users",u.uid));if(!snap.exists()){$("profileView").textContent="Your profile hasn't been created yet. Open your dashboard to complete it.";return;}const p=snap.data(),venue=p.accountType==="venue",photo=venue?(p.venueImageUrl||p.profileImageUrl):p.profileImageUrl;$("dashLink").href=venue?"venue-dashboard.html":"artist-dashboard.html";$("editProfile").href=$("dashLink").href;$("activityTitle").textContent=venue?"Your Events":"Your Collaborations & Events";$("profileView").innerHTML=(photo?'<img src="'+esc(photo)+'" alt="Profile image" style="width:130px;height:130px;object-fit:cover;border-radius:50%;float:left;margin:0 22px 18px 0" onerror="this.style.display=\'none\'">':'')+'<span class="pill">'+esc(venue?(p.venueType||"Venue / Event Organiser"):(p.artistCategory||"Artist"))+'</span><h2 style="font-size:28px;margin:12px 0">'+esc(p.fullName||"Spotlight Member")+'</h2><p>📍 '+esc(p.location||"Location not added")+'</p><p style="white-space:pre-wrap">'+esc(p.description||"No bio added yet.")+'</p><div style="clear:both"></div>';const evs=await getDocs(collection(db,"events"));const items=evs.docs.map(d=>({id:d.id,...d.data()})).filter(e=>!e.cancelled&&(venue?e.venueUid===u.uid:(e.artistUids||[]).includes(u.uid)));$("activityGrid").replaceChildren();items.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(e=>{const c=document.createElement("article");c.className="card";c.innerHTML='<span class="pill">'+esc(e.category||"Event")+'</span><h3>'+esc(e.name)+'</h3><p>📅 '+esc(e.date||"Date TBA")+' · '+esc(e.startTime||"Time TBA")+'</p><p>📍 '+esc(e.location||"Location TBA")+'</p><p>'+(venue?"Participating artists: ":"Hosted by ")+esc(venue?(e.artistNames||[]).join(", ")||"Not announced":e.venueName||"Spotlight venue")+'</p>'; $("activityGrid").append(c);});$("activityStatus").textContent=items.length?items.length+" event(s) linked to your profile.":"No events linked to your profile yet.";}catch(e){console.error(e);$("profileView").textContent="Could not load your public profile. Check Firestore permissions."; $("activityStatus").textContent="Could not load activity.";}});$("logoutButton").onclick=async()=>{await signOut(auth);location.replace("index.html");};
